name: Backup Banco de Fatos Observados

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Criar backup do banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/schema.sql

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/data.sql \
            --data-only \
            --use-copy

          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/roles.sql \
            --role-only

      - name: Compactar backup
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          zip -r "backup-banco-fo-${TIMESTAMP}.zip" backup/

      - name: Instalar bibliotecas Google Drive
        run: |
          python -m pip install --quiet \
            google-api-python-client \
            google-auth

      - name: Enviar backup para Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python <<'PY'
          import json
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials_info = json.loads(
              os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          )

          credentials = service_account.Credentials.from_service_account_info(
              credentials_info,
              scopes=["https://www.googleapis.com/auth/drive.file"]
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )

          backup_file = [
              f for f in os.listdir(".")
              if f.startswith("backup-banco-fo-") and f.endswith(".zip")
          ][0]

          metadata = {
              "name": backup_file,
              "parents": [os.environ["GOOGLE_DRIVE_FOLDER_ID"]]
          }

          media = MediaFileUpload(
              backup_file,
              mimetype="application/zip"
          )

          drive.files().create(
              body=metadata,
              media_body=media,
              fields="id,name"
          ).execute()

          print(f"Backup enviado: {backup_file}")
          PY
